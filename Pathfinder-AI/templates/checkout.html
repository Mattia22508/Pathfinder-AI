<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sblocca Accesso | Pathfinder AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    
    <style>
        .error-msg {
            color: #ff5555;
            font-size: 0.8rem;
            text-align: left;
            margin-top: -15px;
            margin-bottom: 5px;
            display: none;
            font-weight: 600;
        }
        .input-error {
            border-color: #ff5555 !important;
            box-shadow: 0 0 10px rgba(255, 85, 85, 0.3) !important;
        }
        .input-success {
            border-color: var(--neon-accent) !important;
        }
        
        /* Stili per la sezione Codice Promozionale */
        .promo-toggle {
            color: var(--neon-accent);
            font-size: 0.9rem;
            text-align: right;
            cursor: pointer;
            margin-top: -10px;
            transition: 0.3s;
            text-decoration: underline;
        }
        .promo-toggle:hover {
            text-shadow: 0 0 8px var(--neon-glow);
        }
        .promo-section {
            display: none; /* Nascosto di default */
            animation: slideDown 0.3s ease;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .promo-success-msg {
            color: var(--neon-accent);
            font-weight: 700;
            font-size: 0.9rem;
            margin-top: -10px;
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <a href="/" class="logo">PATHFINDER<span>_AI</span></a>
    </header>

    <div class="page-content" style="max-width: 500px;">
        <h2 style="text-align: center;">Sblocca il tuo Piano</h2>
        <p style="text-align: center; margin-bottom: 30px;">Inizializza il terminale di pagamento criptato.</p>
        
        <form class="auth-form" id="paymentForm" action="/checkout" method="POST">
            <label style="color: var(--text-muted); text-align: left; font-size: 0.9rem;">Seleziona il piano operativo:</label>
            <select name="piano" required>
                <option value="starter">Starter - €19/mese</option>
                <option value="pro" selected>Executive (Pro) - €49/mese</option>
                <option value="elite">Elite - €99/mese</option>
            </select>
            
            <div class="promo-toggle" id="promoToggleBtn" onclick="togglePromo()">Hai un codice di accesso speciale?</div>
            
            <div class="promo-section" id="promoSection">
                <input type="text" id="promoCode" name="promo_code" placeholder="Inserisci Codice Promozionale" style="text-transform: uppercase;">
                <p class="promo-success-msg" id="promoSuccessText" style="margin-top: 15px; margin-bottom: 25px; display: none;">Codice MASTER riconosciuto. Bypass pagamento attivato.</p>
            </div>
            
            <div id="creditCardSection" style="display: flex; flex-direction: column; gap: 18px; width: 100%;">
                <input type="text" id="cardName" placeholder="Intestatario Carta">
                <span class="error-msg" id="nameError">Inserisci un nome valido.</span>
                
                <input type="text" id="cardNumber" placeholder="Numero Carta (es. 1234 5678 1234 5678)" maxLength="19">
                <span class="error-msg" id="numberError">Il numero deve contenere 16 cifre.</span>
                
                <div style="display: flex; gap: 20px;">
                    <div style="flex: 1; display: flex; flex-direction: column; gap: 20px;">
                        <input type="text" id="cardExpiry" placeholder="Scadenza (MM/AA)" maxLength="5">
                        <span class="error-msg" id="expiryError">Data non valida.</span>
                    </div>
                    
                    <div style="flex: 1; display: flex; flex-direction: column; gap: 20px;">
                        <input type="text" id="cardCvv" placeholder="CVV (3 cifre)" maxLength="3">
                        <span class="error-msg" id="cvvError">CVV errato.</span>
                    </div>
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary" id="submitBtn" style="margin-top: 10px;">Autentica e Paga</button>
        </form>
    </div>

    <script>
        const form = document.getElementById('paymentForm');
        const cardName = document.getElementById('cardName');
        const cardNumber = document.getElementById('cardNumber');
        const cardExpiry = document.getElementById('cardExpiry');
        const cardCvv = document.getElementById('cardCvv');
        
        const promoToggleBtn = document.getElementById('promoToggleBtn');
        const promoSection = document.getElementById('promoSection');
        const promoCode = document.getElementById('promoCode');
        const creditCardSection = document.getElementById('creditCardSection');
        const promoSuccessText = document.getElementById('promoSuccessText');
        const submitBtn = document.getElementById('submitBtn');

        let isPromoBypassActive = false; // Variabile magica per disattivare i controlli carta

        // Mostra/Nascondi la casella del codice sconto
        function togglePromo() {
            if (promoSection.style.display === 'none' || promoSection.style.display === '') {
                promoSection.style.display = 'block';
                promoToggleBtn.innerText = "Nascondi codice speciale";
            } else {
                promoSection.style.display = 'none';
                promoToggleBtn.innerText = "Hai un codice di accesso speciale?";
                promoCode.value = ""; // Resetta il codice
                checkPromoLogic(); // Riavvia i controlli normali
            }
        }

        // Simula il controllo in tempo reale del codice (in futuro lo farà Python con il database)
        promoCode.addEventListener('input', function() {
            this.value = this.value.toUpperCase(); // Forza maiuscolo
            checkPromoLogic();
        });

        function checkPromoLogic() {
            if (promoCode.value === 'PROF100' || promoCode.value === 'TRIAL10') {
                // EFFETTO WOW: Codice giusto? Nascondo la carta di credito!
                creditCardSection.style.display = 'none';
                promoSuccessText.style.display = 'block';
                submitBtn.innerText = "Attiva Accesso VIP";
                isPromoBypassActive = true;
            } else {
                // Torna normale
                creditCardSection.style.display = 'flex';
                promoSuccessText.style.display = 'none';
                submitBtn.innerText = "Autentica e Paga";
                isPromoBypassActive = false;
            }
        }

        // --- CONTROLLI CARTA (Gli stessi di prima, perfetti) ---
        cardName.addEventListener('input', function(e) {
            this.value = this.value.replace(/[0-9]/g, '');
            if(!isPromoBypassActive) validateField(this, this.value.length > 3, 'nameError');
        });

        cardNumber.addEventListener('input', function (e) {
            let value = this.value.replace(/\D/g, '');
            value = value.replace(/(.{4})/g, '$1 ').trim();
            this.value = value;
            if(!isPromoBypassActive) validateField(this, this.value.replace(/\s/g, '').length === 16, 'numberError');
        });

        cardExpiry.addEventListener('input', function (e) {
            let value = this.value.replace(/\D/g, '');
            if (value.length >= 2) {
                let month = parseInt(value.substring(0, 2));
                if (month > 12) month = 12; 
                if (month === 0) month = '01';
                let monthStr = month.toString().padStart(2, '0');
                value = monthStr + '/' + value.substring(2, 4);
            }
            this.value = value;

            let isValid = false;
            const errorSpan = document.getElementById('expiryError');

            if (this.value.length === 5) {
                const inputMonth = parseInt(this.value.substring(0, 2));
                const inputYear = parseInt(this.value.substring(3, 5));
                const currentDate = new Date();
                const currentYear = parseInt(currentDate.getFullYear().toString().slice(-2));
                const currentMonth = currentDate.getMonth() + 1;
                
                if (inputYear < currentYear) {
                    errorSpan.innerText = "Carta scaduta (Anno passato).";
                } else if (inputYear === currentYear && inputMonth < currentMonth) {
                    errorSpan.innerText = "Carta scaduta (Mese passato).";
                } else {
                    isValid = true;
                }
            } else {
                errorSpan.innerText = "Formato data non valido.";
            }
            if(!isPromoBypassActive) validateField(this, isValid, 'expiryError');
        });

        cardCvv.addEventListener('input', function (e) {
            this.value = this.value.replace(/\D/g, '');
            if(!isPromoBypassActive) validateField(this, this.value.length === 3, 'cvvError');
        });

        function validateField(inputElement, isValid, errorElementId) {
            const errorElement = document.getElementById(errorElementId);
            if (isValid) {
                inputElement.classList.remove('input-error');
                inputElement.classList.add('input-success');
                errorElement.style.display = 'none';
            } else {
                inputElement.classList.remove('input-success');
                if(inputElement.value.length > 0) {
                    inputElement.classList.add('input-error');
                    errorElement.style.display = 'block';
                } else {
                    inputElement.classList.remove('input-error');
                    errorElement.style.display = 'none';
                }
            }
            return isValid;
        }

        function checkExpiryTimeReal(val) {
            if (val.length !== 5) return false;
            const inputMonth = parseInt(val.substring(0, 2));
            const inputYear = parseInt(val.substring(3, 5));
            const currentDate = new Date();
            const currentYear = parseInt(currentDate.getFullYear().toString().slice(-2));
            const currentMonth = currentDate.getMonth() + 1;
            return inputYear > currentYear || (inputYear === currentYear && inputMonth >= currentMonth);
        }

        // --- CONTROLLO FINALE PRIMA DELL'INVIO ---
        form.addEventListener('submit', function(e) {
            // Se c'è il codice master attivo, bypassa tutto e invia!
            if (isPromoBypassActive) {
                return true; 
            }

            // Altrimenti fai i controlli severi sulla carta
            const isNameValid = cardName.value.length > 3;
            const isNumberValid = cardNumber.value.replace(/\s/g, '').length === 16;
            const isExpiryValid = checkExpiryTimeReal(cardExpiry.value);
            const isCvvValid = cardCvv.value.length === 3;

            validateField(cardName, isNameValid, 'nameError');
            validateField(cardNumber, isNumberValid, 'numberError');
            validateField(cardExpiry, isExpiryValid, 'expiryError');
            validateField(cardCvv, isCvvValid, 'cvvError');

            if (!isNameValid || !isNumberValid || !isExpiryValid || !isCvvValid) {
                e.preventDefault(); 
                const btn = document.getElementById('submitBtn');
                btn.style.transform = 'translateX(-10px)';
                setTimeout(() => btn.style.transform = 'translateX(10px)', 100);
                setTimeout(() => btn.style.transform = 'translateX(0)', 200);
            }
        });
    </script>
</body>
</html>
