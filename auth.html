<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accedi | Pathfinder AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header>
        <a href="/" class="logo">PATHFINDER<span>_AI</span></a>
        <nav>
            <a href="/manifesto">Il Manifesto</a>
            <a href="/come-funziona">Come Funziona</a>
            <a href="/auth">Accedi</a>
        </nav>
    </header>

    <div class="page-content" style="max-width: 450px; text-align: center;">
        <h2>Accedi o Registrati</h2>
        <p>Inserisci i tuoi dati per accedere alla piattaforma.</p>
        
        <form class="auth-form" action="/auth" method="POST">
            <input type="text" name="username" placeholder="Nome Utente" required>
            <input type="email" name="email" placeholder="Email" required>
            
            <div class="password-wrapper">
                <input type="password" id="passwordInput" placeholder="Password" required>
                <span class="toggle-password" id="togglePasswordBtn">👁️</span>
            </div>
            
            <a href="/reset-password" class="forgot-password">Password dimenticata?</a>
            
            <button type="submit" class="btn btn-primary">Accedi</button>
            
            <div class="divider"><span>oppure</span></div>
            
            <button type="button" class="btn btn-google">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Logo Google">
                Accedi con Google
            </button>
        </form>
    </div>

    <script>
        const toggleBtn = document.getElementById('togglePasswordBtn');
        const passwordInput = document.getElementById('passwordInput');

        toggleBtn.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.textContent = type === 'password' ? '👁️' : '🙈';
        });
    </script>
</body>
</html>
