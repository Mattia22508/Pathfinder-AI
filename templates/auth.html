<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accedi | Pathfinder AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        /* --- AGGIUNTA DA 10 E LODE: STILI PER ERRORE PASSWORD --- */
        .input-error {
            border: 2px solid #ff4d4d !important;
            box-shadow: 0 0 10px rgba(255, 77, 77, 0.4) !important;
            background-color: rgba(255, 77, 77, 0.05) !important;
            transition: all 0.3s ease;
        }
        .error-message {
            color: #ff4d4d;
            font-size: 0.9em;
            margin-top: -10px;
            margin-bottom: 15px;
            text-align: left;
            font-weight: 600;
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <header>
        <a href="/" class="logo">PATHFINDER<span>_AI</span></a>
        <nav>
            <a href="/manifesto">Il Manifesto</a>
            <a href="/come-funziona">Come Funziona</a>
            <a href="/auth">Accedi</a>
        </nav>
    </header>

    <div class="page-content" style="max-width: 450px; text-align: center;">
        <h2>Accedi o Registrati</h2>
        <p>Inserisci i tuoi dati per accedere alla piattaforma.</p>
        
        <form class="auth-form" action="/auth" method="POST">
            <input type="text" name="username" placeholder="Nome Utente" required>
            <input type="email" name="email" placeholder="Email" required>
            
            <div class="password-wrapper">
                <input type="password" name="password" id="passwordInput" placeholder="Password" required class="{% if error %}input-error{% endif %}">
                <span class="toggle-password" id="togglePasswordBtn">👁️</span>
            </div>
            
            {% if error %}
                <div class="error-message">⚠️ {{ error }}</div>
            {% endif %}
            
            <a href="/reset-password" class="forgot-password">Password dimenticata?</a>
            
            <button type="submit" class="btn btn-primary">Accedi</button>
            
            <div class="divider"><span>oppure</span></div>
            
            <button type="button" class="btn btn-google">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Logo Google">
                Accedi con Google
            </button>
        </form>
    </div>

    <script>
        const toggleBtn = document.getElementById('togglePasswordBtn');
        const passwordInput = document.getElementById('passwordInput');

        toggleBtn.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.textContent = type === 'password' ? '👁️' : '🙈';
        });
    </script>
</body>
</html>
