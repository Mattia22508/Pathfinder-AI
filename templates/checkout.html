<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sblocca Accesso | Pathfinder AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    
    <script src="https://www.paypal.com/sdk/js?client-id=sb&currency=EUR"></script>

    <style>
        .error-msg {
            color: #ff5555;
            font-size: 0.8rem;
            text-align: left;
            margin-top: -15px;
            margin-bottom: 5px;
            display: none;
            font-weight: 600;
        }
        .success-box {
            background: rgba(0, 255, 204, 0.1);
            border: 1px solid var(--neon-accent);
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 15px;
            color: var(--neon-accent);
            font-weight: bold;
            font-size: 0.9rem;
        }
        .promo-container {
            margin-bottom: 20px;
            text-align: left;
        }
        .promo-input-group {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }
        
        /* --- INIZIO NUOVO DESIGN PREMIUM DEI PACCHETTI --- */
        .plan-selector {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }
        
        .plan-option {
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(255, 255, 255, 0.08);
            padding: 18px 20px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .plan-option:hover {
            border-color: rgba(0, 255, 204, 0.4);
            background: rgba(255, 255, 255, 0.06);
        }
        
        /* Addio quadrato verde! Nascondiamo il pallino di default */
        .plan-option input[type="radio"] {
            display: none; 
        }

        /* Magia CSS: Quando il pacchetto è selezionato, illuminiamo l'intera card! */
        .plan-option:has(input[type="radio"]:checked) {
            border-color: var(--neon-accent);
            background: rgba(0, 255, 204, 0.08);
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.15);
            transform: scale(1.02); /* Leggero effetto pop-up 3D */
        }

        .plan-info {
            display: flex;
            align-items: center;
        }
        
        .plan-info span {
            font-weight: 600;
            font-size: 1.05rem;
            letter-spacing: 0.5px;
        }
        
        .plan-price {
            font-weight: 900;
            font-size: 1.2rem;
            color: var(--neon-accent);
        }
        /* --- FINE NUOVO DESIGN PACCHETTI --- */
    </style>
</head>
<body>

    <header>
        <a href="/" class="logo">PATHFINDER<span>_AI</span></a>
    </header>

    <div class="page-content" style="max-width: 500px; text-align: center;">
        <h2>Sblocca il tuo Potenziale</h2>
        <p style="margin-bottom: 20px;">Scegli il tuo piano operativo e completa il pagamento sicuro.</p>
        
        <form id="checkoutForm" action="/checkout" method="POST" class="auth-form">
            
            <div class="plan-selector">
                <label class="plan-option">
                    <div class="plan-info">
                        <input type="radio" name="piano" value="starter" checked onchange="aggiornaPrezzo()">
                        <span>Piano Starter (Roadmap Base)</span>
                    </div>
                    <span class="plan-price">€19.00</span>
                </label>
                <label class="plan-option">
                    <div class="plan-info">
                        <input type="radio" name="piano" value="pro" onchange="aggiornaPrezzo()">
                        <span>Piano Pro (Full AI Engine)</span>
                    </div>
                    <span class="plan-price">€49.00</span>
                </label>
                <label class="plan-option">
                    <div class="plan-info">
                        <input type="radio" name="piano" value="elite" onchange="aggiornaPrezzo()">
                        <span>Piano Elite (Mentoring 1to1)</span>
                    </div>
                    <span class="plan-price">€99.00</span>
                </label>
            </div>

            <div class="promo-container">
                <label style="font-size: 0.9rem; color: var(--text-muted);">Hai un codice promozionale?</label>
                <div class="promo-input-group">
                    <input type="text" id="promoInput" name="promo_code" placeholder="Es. Codice_Promo" style="margin-bottom: 0;">
                    <button type="button" class="btn btn-primary" style="width: auto; padding: 0 20px; font-size: 0.9rem;" onclick="applicaCodice()">Applica</button>
                </div>
                <div id="promoSuccess" class="success-box" style="display: none; margin-top: 10px;"></div>
            </div>

            <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px;">

            <div id="paypal-button-container"></div>

            <button type="submit" id="submitBtnFree" class="btn btn-primary" style="display: none; width: 100%;">
                Attiva Abbonamento Gratuito 
            </button>

        </form>
    </div>

    <script>
        let isPromoActive = false;

        // Funzione per capire il costo del piano selezionato
        function getPrezzoCorrente() {
            const piano = document.querySelector('input[name="piano"]:checked').value;
            if (piano === 'starter') return 19.00;
            if (piano === 'pro') return 49.00;
            if (piano === 'elite') return 99.00;
            return 19.00;
        }

        function aggiornaPrezzo() {
            // Se c'è un codice sconto attivo, ricalcola lo stato quando si cambia piano
            if (isPromoActive) {
                applicaCodice();
            }
        }

        function applicaCodice() {
            const codice = document.getElementById('promoInput').value.trim().toUpperCase();
            const successBox = document.getElementById('promoSuccess');
            const paypalContainer = document.getElementById('paypal-button-container');
            const freeSubmitBtn = document.getElementById('submitBtnFree');

            if (codice === 'PROF100' || codice === 'TRIAL10') {
                isPromoActive = true;
                successBox.style.display = 'block';
                successBox.innerText = "CODICE APPLICATO: INGRESSO VIP Attivo!";
                
                // Nasconde il pagamento PayPal e mostra il bottone di invio diretto gratuito
                paypalContainer.style.display = 'none';
                freeSubmitBtn.style.display = 'block';
            } else {
                isPromoActive = false;
                successBox.style.display = 'none';
                paypalContainer.style.display = 'block';
                freeSubmitBtn.style.display = 'none';
            }
        }

        // --- INTEGRAZIONE INTEGRALE SCRIPT SMART BUTTONS PAYPAL ---
        paypal.Buttons({
            // Crea l'ordine passando l'importo dinamico in base al piano scelto
            createOrder: function(data, actions) {
                let importo = getPrezzoCorrente();
                return actions.order.create({
                    purchase_units: [{
                        amount: {
                            value: importo.toFixed(2),
                            currency_code: 'EUR'
                        }
                    }]
                });
            },
            // Cattura il pagamento andato a buon fine
            onApprove: function(data, actions) {
                return actions.order.capture().then(function(details) {
                    alert('Pagamento approvato da ' + details.payer.name.given_name + '! Attivazione account in corso...');
                    // Invia in automatico il modulo verso Flask per registrare tutto su Supabase
                    document.getElementById('checkoutForm').submit();
                });
            },
            // Gestione di eventuali errori nel caricamento di PayPal
            onError: function (err) {
                alert('Si è verificato un errore durante la transazione con PayPal. Riprova.');
            }
        }).render('#paypal-button-container'); // Renderizza i bottoni nel div dedicato
    </script>
</body>
</html>
